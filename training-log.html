<!DOCTYPE html>
<html lang=„pt“>
<head>
<meta charset=„UTF-8“/>
<meta name=„viewport“ content=„width=device-width, initial-scale=1.0, user-scalable=no“/>
<title>Training Log</title>
<link href=„https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap“ rel=„stylesheet“/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0d0d0d;--bg2:#0a0a0a;--bg3:#141414;--border:#1e1e1e;--border2:#2a2a2a;--text:#e8e0d0;--muted:#555;--accent:#c8f044;--accent-bg:#c8f04415;--accent-border:#c8f04440;}
  body{font-family:’IBM Plex Mono’,monospace;background:var(--bg);color:var(--text);min-height:100vh;}
  input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:8px 12px;font-family:inherit;font-size:13px;border-radius:4px;outline:none;width:100%;}
  input:focus{border-color:var(--accent);}
  button{cursor:pointer;font-family:inherit;border:none;outline:none;}
  #header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 18px;}
  #header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  #logo{font-family:’Syne’,sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.02em;}
  #logo span{color:var(--accent);}
  #meta{font-size:10px;color:var(--muted);margin-top:2px;}
  #sync-btn{background:var(--accent);color:#000;font-size:11px;font-weight:700;padding:8px 14px;border-radius:6px;white-space:nowrap;}
  #nav{display:flex;}
  .nav-btn{background:none;color:var(--muted);font-size:11px;padding:8px 14px;letter-spacing:0.1em;text-transform:uppercase;border-bottom:2px solid transparent;transition:all 0.15s;}
  .nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  #ics-msg{display:none;margin-top:10px;background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent);font-size:12px;padding:8px 14px;border-radius:6px;}
  #app{padding:16px 18px;max-width:700px;margin:0 auto;}
  .view{display:none;}.view.active{display:block;}
  #date-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  #date-input{width:auto;color:var(--accent);background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;}
  #date-label{font-size:12px;color:var(--muted);flex:1;}
  .today-badge{font-size:10px;padding:2px 8px;background:var(--accent-bg);color:var(--accent);border-radius:3px;border:1px solid var(--accent-border);}
  .ath-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #181818;}
  .ath-avatar{width:36px;height:36px;background:#1a2210;border:1px solid #c8f04430;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--accent);flex-shrink:0;margin-top:2px;}
  .ath-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px;}
  .ath-label.done{color:var(--text);}
  .ath-done-tags{font-size:10px;color:var(--accent);margin-left:6px;}
  .workouts-wrap{display:flex;flex-wrap:wrap;gap:5px;}
  .wbtn{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:4px;background:#111;border:1px solid #1e1e1e;cursor:pointer;}
  .wbtn:hover{border-color:#444;}
  .wbtn.on{background:var(--accent-bg);border-color:var(--accent-border);}
  .wbtn .cb{width:16px;height:16px;border:1.5px solid #333;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wbtn.on .cb{background:var(--accent);border-color:var(--accent);}
  .wbtn .wl{font-size:11px;color:#555;}
  .wbtn.on .wl{color:var(--accent);}
  #summary-box{margin-top:20px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;}
  .sum-title{font-size:10px;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
  .sum-row{display:flex;gap:8px;margin-bottom:5px;font-size:12px;flex-wrap:wrap;}
  .sum-name{color:var(--accent);min-width:160px;}
  .sum-dash{color:#2a2a2a;}
  .sum-data{color:#888;}
  .empty-msg{color:#333;font-size:12px;}
  .hist-card{margin-bottom:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .hist-head{padding:8px 14px;border-bottom:1px solid #141414;display:flex;justify-content:space-between;align-items:center;}
  .hist-date{font-size:12px;color:var(--accent);font-weight:600;}
  .hist-edit{background:none;color:var(--muted);font-size:11px;padding:2px 8px;border:1px solid var(--border2);border-radius:3px;}
  .hist-body{padding:10px 14px;}
  #add-row{display:flex;gap:8px;margin-bottom:14px;}
  #add-btn{background:var(--accent);color:#000;padding:8px 16px;border-radius:4px;font-weight:700;font-size:14px;flex-shrink:0;}
  .ath-list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #181818;}
  .ath-list-av{width:32px;height:32px;background:#1a2210;border:1px solid #c8f04430;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--accent);flex-shrink:0;}
  .ath-del{background:none;color:#333;font-size:16px;padding:4px 8px;border:1px solid var(--border2);border-radius:3px;}
  .ath-del:hover{color:#e05050;border-color:#e05050;}
  .section-label{font-size:10px;color:var(--muted);letter-spacing:0.1em;margin-bottom:12px;}
</style>
</head>
<body>
<div id=„header“>
  <div id=„header-top“>
    <div>
      <div id=„logo“>TRAINING<span>LOG</span></div>
      <div id=„meta“>0 atletas · 0 sessões</div>
    </div>
    <button id=„sync-btn“ onclick=„document.getElementById(‚ics-file‘).click()“>📥 Importar .ics</button>
    <input type=„file“ id=„ics-file“ accept=„.ics“ style=„display:none“ onchange=„handleICSFile(event)“/>
  </div>
  <div id=„ics-msg“></div>
  <div id=„nav“>
    <button class=„nav-btn active“ onclick=„setView(‚today‘)“>Hoje</button>
    <button class=„nav-btn“ onclick=„setView(‚history‘)“>Histórico</button>
    <button class=„nav-btn“ onclick=„setView(‚athletes‘)“>Atletas</button>
  </div>
</div>

<div id=„app“>
  <div id=„view-today“ class=„view active“>
    <div id=„date-bar“>
      <input type=„date“ id=„date-input“ onchange=„onDateChange()“/>
      <span id=„date-label“></span>
      <span id=„today-badge“ class=„today-badge“ style=„display:none“>HOJE</span>
    </div>
    <div id=„ath-rows“></div>
    <div id=„summary-box“>
      <div class=„sum-title“>RESUMO DO DIA</div>
      <div id=„summary-content“></div>
    </div>
  </div>
  <div id=„view-history“ class=„view“>
    <div class=„section-label“>HISTÓRICO DE SESSÕES</div>
    <div id=„hist-list“></div>
  </div>
  <div id=„view-athletes“ class=„view“>
    <div id=„add-row“>
      <input id=„new-name“ placeholder=„Adicionar atleta manualmente...“ onkeydown=„if(event.key===‚Enter‘)addAthlete()“/>
      <button id=„add-btn“ onclick=„addAthlete()“>+</button>
    </div>
    <input id=„search-ath“ placeholder=„Pesquisar...“ oninput=„renderAthletesList()“ style=„margin-bottom:12px“/>
    <div id=„ath-list-meta“ class=„section-label“></div>
    <div id=„ath-list“></div>
  </div>
</div>

<script>
const WORKOUT_TYPES = [
  {key:“upper“,    label:“Upper Body“, short:“UPPER“},
  {key:“legs“,     label:“Legs“,       short:“LEGS“},
  {key:“chest“,    label:“Chest“,      short:“CHEST“},
  {key:“back“,     label:“Back“,       short:“BACK“},
  {key:“biceps“,   label:“Biceps“,     short:“BIC“},
  {key:“triceps“,  label:“Triceps“,    short:“TRI“},
  {key:“shoulders“,label:“Shoulders“,  short:“SHL“},
  {key:“abs“,      label:“Abs“,        short:“ABS“},
  {key:“cardio“,   label:“Cardio“,     short:“CARD“},
  {key:“fb“,       label:“Full Body“,  short:“FB“},
  {key:“push“,     label:“Push“,       short:“PUSH“},
  {key:“pull“,     label:“Pull“,       short:“PULL“},
  {key:“lco“,      label:“Lower/Core“, short:“L/CO“},
];

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let athletes    = load(„tl4_athletes“, []);
let sessions    = load(„tl4_sessions“, {});
let dayPresence = load(„tl4_presence“, {});
let selectedDate = new Date().toISOString().split(„T“)[0];

function todayStr(){ return new Date().toISOString().split(„T“)[0]; }

function displayDate(str){
  try{const[y,m,d]=str.split(„-„).map(Number);return new Date(y,m-1,d).toLocaleDateString(„pt-PT“,{weekday:“long“,day:“2-digit“,month:“2-digit“,year:“numeric“});}
  catch{return str;}
}

function cleanName(raw){
  return raw.replace(/^pt\s+/i,““).replace(/\r/g,““).replace(/\\r/g,““).replace(/&amp;/g,“&“).trim();
}

function getInitials(name){
  return name.split(/[\s&]+/).filter(Boolean).map(w=>w[0]).join(„“).slice(0,3).toUpperCase();
}

function findOrCreateAthlete(name){
  let a = athletes.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!a){ a={id:Date.now()+Math.floor(Math.random()*999999),name}; athletes.push(a); }
  return a;
}

function getDayAthletes(date){
  const entries = dayPresence[date]||[];
  return entries
    .sort((a,b)=>{
      const ta = typeof a===„object“ ? a.time : „000000“;
      const tb = typeof b===„object“ ? b.time : „000000“;
      return ta.localeCompare(tb);
    })
    .map(e=>athletes.find(a=>a.id===(typeof e===„object“?e.id:e)))
    .filter(Boolean);
}

function getSummary(athleteId,date){
  const s=sessions[date]?.[athleteId]||{};
  return WORKOUT_TYPES.filter(w=>s[w.key]).map(w=>w.short).join(„ / „)||null;
}

function getDatesWithData(){
  return Object.keys(sessions)
    .filter(d=>Object.values(sessions[d]||{}).some(a=>Object.values(a).some(Boolean)))
    .sort((a,b)=>b.localeCompare(a));
}

function toggleWorkout(athleteId,wkey){
  if(!sessions[selectedDate]) sessions[selectedDate]={};
  if(!sessions[selectedDate][athleteId]) sessions[selectedDate][athleteId]={};
  sessions[selectedDate][athleteId][wkey]=!sessions[selectedDate][athleteId][wkey];
  save(„tl4_sessions“,sessions);
  renderToday();
}

// ── DATE UTILS ──
function dateStrToObj(str){ const[y,m,d]=str.split(„-„).map(Number); return new Date(y,m-1,d); }
function dateObjToStr(d){ return d.getFullYear()+“-„+String(d.getMonth()+1).padStart(2,“0“)+“-„+String(d.getDate()).padStart(2,“0“); }
function icsDateToStr(s){ return s.slice(0,4)+“-„+s.slice(4,6)+“-„+s.slice(6,8); }

// Parse UNTIL date from RRULE
function parseUntil(until){
  // UNTIL=20241231T000000Z or UNTIL=20241231
  const m=until.match(/(\d{8})/);
  return m ? icsDateToStr(m[1]) : null;
}

// Expand a recurring event into all its occurrence dates
// Supports FREQ=WEEKLY and FREQ=DAILY with INTERVAL, UNTIL, COUNT
// Also handles BYDAY for weekly
function expandRecurrence(dtstart, rrule, exdates, overrideDates){
  const dates = new Set();
  const startStr = icsDateToStr(dtstart);
  const startObj = dateStrToObj(startStr);

  const freqMatch = rrule.match(/FREQ=(\w+)/);
  if(!freqMatch) { dates.add(startStr); return dates; }
  const freq = freqMatch[1];

  const intervalMatch = rrule.match(/INTERVAL=(\d+)/);
  const interval = intervalMatch ? parseInt(intervalMatch[1]) : 1;

  const untilMatch = rrule.match(/UNTIL=([^;]+)/);
  const untilStr = untilMatch ? parseUntil(untilMatch[1]) : null;
  // Limit expansion to 2 years from today to avoid infinite loops
  const today = new Date();
  const limitDate = new Date(today.getFullYear()+1, today.getMonth(), today.getDate());
  const until = untilStr ? new Date(Math.min(dateStrToObj(untilStr), limitDate)) : limitDate;

  const countMatch = rrule.match(/COUNT=(\d+)/);
  const maxCount = countMatch ? parseInt(countMatch[1]) : 9999;

  // For weekly, get allowed weekdays (0=Sun)
  let allowedDays = null;
  if(freq===„WEEKLY“){
    const bydayMatch = rrule.match(/BYDAY=([^;]+)/);
    if(bydayMatch){
      const dayMap={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
      allowedDays = new Set(bydayMatch[1].split(„,“).map(d=>dayMap[d.trim().toUpperCase()]).filter(d=>d!==undefined));
    }
  }

  let cur = new Date(startObj);
  let count = 0;
  const exSet = new Set(exdates);
  const overSet = new Set(overrideDates);

  while(cur <= until && count < maxCount){
    const dStr = dateObjToStr(cur);
    const dayOk = !allowedDays || allowedDays.has(cur.getDay());
    if(dayOk && !exSet.has(dStr) && !overSet.has(dStr)){
      dates.add(dStr);
      count++;
    }
    // Advance
    if(freq===„DAILY“) cur.setDate(cur.getDate()+interval);
    else if(freq===„WEEKLY“) cur.setDate(cur.getDate()+7*interval);
    else if(freq===„MONTHLY“) cur.setMonth(cur.getMonth()+interval);
    else break;
  }
  return dates;
}

// ── PARSE & PROCESS ICS ──
function processICSText(text){
  // Unfold lines
  const unfolded = text.replace(/\r?\n[ \t]/g,““);
  const blocks = unfolded.split(„BEGIN:VEVENT“).slice(1);

  const newPres = JSON.parse(JSON.stringify(dayPresence));
  let eventCount = 0;
  let athleteCount = 0;

  // First pass: collect all RECURRENCE-ID overrides and EXDATEs per UID
  const uidExdates = {};    // uid -> Set of date strings excluded
  const uidOverrides = {};  // uid -> Set of original date strings that have overrides

  blocks.forEach(block=>{
    const uidM = block.match(/^UID:(.+)$/m);
    if(!uidM) return;
    const uid = uidM[1].trim();

    // EXDATEs
    const exMatches = [...block.matchAll(/^EXDATE[^:]*:(.+)$/mg)];
    exMatches.forEach(m=>{
      const vals = m[1].trim().split(„,“);
      vals.forEach(v=>{ const dm=v.match(/(\d{8})/); if(dm){ if(!uidExdates[uid]) uidExdates[uid]=new Set(); uidExdates[uid].add(icsDateToStr(dm[1])); }});
    });

    // RECURRENCE-ID (overrides)
    const recIdM = block.match(/^RECURRENCE-ID[^:]*:(\d{8})/m);
    if(recIdM){ if(!uidOverrides[uid]) uidOverrides[uid]=new Set(); uidOverrides[uid].add(icsDateToStr(recIdM[1])); }
  });

  // Second pass: process events
  blocks.forEach(block=>{
    const summaryM = block.match(/^SUMMARY[^:]*:(.+)$/m);
    if(!summaryM) return;
    const rawSummary = summaryM[1].trim();
    if(!/^pt\s/i.test(rawSummary)) return;
    const name = cleanName(rawSummary);
    if(!name) return;

    const dtstartM = block.match(/^DTSTART[^:]*:(\d{8})/m);
    if(!dtstartM) return;
    const dtstart = dtstartM[1];

    const uidM = block.match(/^UID:(.+)$/m);
    const uid = uidM ? uidM[1].trim() : null;

    const rruleM = block.match(/^RRULE:(.+)$/m);
    const isOverride = block.match(/^RECURRENCE-ID/m);

    const ath = findOrCreateAthlete(name);
    let datesToAdd = new Set();

    if(isOverride){
      // This is a modified occurrence — just add its actual DTSTART date
      datesToAdd.add(icsDateToStr(dtstart));
    } else if(rruleM){
      // Recurring event — expand
      const exdates = uid && uidExdates[uid] ? [...uidExdates[uid]] : [];
      const overrides = uid && uidOverrides[uid] ? [...uidOverrides[uid]] : [];
      datesToAdd = expandRecurrence(dtstart, rruleM[1], exdates, overrides);
    } else {
      // Single event
      datesToAdd.add(icsDateToStr(dtstart));
    }

    // Extract time (HHMMSS) from DTSTART for sorting
    const timeM = block.match(/^DTSTART[^:]*:(\d{8}T(\d{6}))/m);
    const timeStr = timeM ? timeM[2] : „000000“;

    datesToAdd.forEach(date=>{
      if(!newPres[date]) newPres[date]=[];
      // Store as {id, time} object for sorting, or plain id for backward compat
      const existing = newPres[date];
      const alreadyIn = existing.some(e=>(e.id||e)===ath.id);
      if(!alreadyIn){
        existing.push({id:ath.id, time:timeStr});
        eventCount++;
      }
      newPres[date] = existing;
    });
    athleteCount++;
  });

  dayPresence = newPres;
  save(„tl4_presence“, dayPresence);
  save(„tl4_athletes“, athletes);
  updateMeta();
  renderToday();
  return {eventCount, athleteCount};
}

function handleICSFile(e){
  const file=e.target.files[0];
  if(!file) return;
  showMsg(„⏳ A processar calendário...“);
  const reader=new FileReader();
  reader.onload=ev=>{
    // Reset presence to reimport clean
    dayPresence={};
    athletes=[];
    save(„tl4_athletes“,[]);
    save(„tl4_presence“,{});
    const {eventCount,athleteCount}=processICSText(ev.target.result);
    showMsg(„✓ „+athleteCount+“ atletas · „+eventCount+“ sessões importadas“,5000);
  };
  reader.readAsText(file);
  e.target.value=„“;
}

function showMsg(text,timeout){
  const el=document.getElementById(„ics-msg“);
  el.textContent=text; el.style.display=„block“;
  if(timeout) setTimeout(()=>el.style.display=„none“,timeout);
}

function updateMeta(){
  const totalDays = Object.keys(dayPresence).filter(d=>(dayPresence[d]||[]).length>0).length;
  document.getElementById(„meta“).textContent=athletes.length+“ atletas · „+totalDays+“ dias“;
}

// ── RENDER TODAY ──
function renderToday(){
  const today=todayStr();
  document.getElementById(„date-input“).value=selectedDate;
  document.getElementById(„date-label“).textContent=displayDate(selectedDate);
  document.getElementById(„today-badge“).style.display=selectedDate===today?“inline“:“none“;
  updateMeta();

  const dayAths=getDayAthletes(selectedDate);
  const rows=document.getElementById(„ath-rows“);
  rows.innerHTML=„“;

  if(!dayAths.length){
    rows.innerHTML=‚<div style=„text-align:center;padding:40px 0;color:#333;font-size:13px“>Nenhum treino para este dia.<br/><span style=„font-size:11px;color:#222“>Toca em 📥 Importar .ics para carregar o calendário.</span></div>‘;
  } else {
    dayAths.forEach(a=>{
      const ath=sessions[selectedDate]?.[a.id]||{};
      const done=WORKOUT_TYPES.filter(w=>ath[w.key]);
      const row=document.createElement(„div“);
      row.className=„ath-row“;
      const labelClass=done.length?“ath-label done“:“ath-label“;
      const doneTags=done.length?`<span class=„ath-done-tags“>${done.map(w=>w.short).join(„ · „)}</span>`:““;
      const btns=WORKOUT_TYPES.map(wt=>{
        const on=ath[wt.key]?“on“:““;
        const check=ath[wt.key]?`<svg width=„10“ height=„10“ viewBox=„0 0 12 12“><polyline points=„2,6 5,9 10,3“ stroke=„#000“ stroke-width=„2.2“ fill=„none“ stroke-linecap=„round“ stroke-linejoin=„round“/></svg>`:““;
        return `<button class=„wbtn ${on}“ onclick=„toggleWorkout(${a.id},’${wt.key}’)“><div class=„cb“>${check}</div><span class=„wl“>${wt.label}</span></button>`;
      }).join(„“);
      row.innerHTML=`<div class=„ath-avatar“>${getInitials(a.name)}</div><div style=„flex:1“><div style=„display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:7px“><span class=„${labelClass}“>${a.name}</span>${doneTags}</div><div class=„workouts-wrap“>${btns}</div></div>`;
      rows.appendChild(row);
    });
  }

  const sc=document.getElementById(„summary-content“);
  sc.innerHTML=„“;
  const hasDone=dayAths.some(a=>getSummary(a.id,selectedDate));
  if(!hasDone){
    sc.innerHTML=‚<div class=„empty-msg“>Nenhum treino registado ainda.</div>‘;
  } else {
    dayAths.forEach(a=>{
      const s=getSummary(a.id,selectedDate);
      if(s) sc.innerHTML+=`<div class=„sum-row“><span class=„sum-name“>${a.name}</span><span class=„sum-dash“>–</span><span class=„sum-data“>${s}</span></div>`;
    });
  }
}

// ── RENDER HISTORY ──
function renderHistory(){
  const list=document.getElementById(„hist-list“);
  list.innerHTML=„“;
  const dates=getDatesWithData();
  if(!dates.length){list.innerHTML=‚<div style=„text-align:center;padding:40px 0;color:#333;font-size:13px“>Sem sessões registadas.</div>‘;return;}
  dates.forEach(d=>{
    let rows=„“;
    getDayAthletes(d).forEach(a=>{
      const s=getSummary(a.id,d);
      if(s) rows+=`<div class=„sum-row“><span class=„sum-name“>${a.name}</span><span class=„sum-dash“>–</span><span class=„sum-data“>${s}</span></div>`;
    });
    if(!rows) return;
    const card=document.createElement(„div“);
    card.className=„hist-card“;
    card.innerHTML=`<div class=„hist-head“><span class=„hist-date“>${displayDate(d)}</span><button class=„hist-edit“ onclick=„goToDate(‚${d}‘)“>Editar</button></div><div class=„hist-body“>${rows}</div>`;
    list.appendChild(card);
  });
}

function goToDate(d){selectedDate=d;setView(„today“);}

// ── RENDER ATHLETES ──
function renderAthletesList(){
  const q=(document.getElementById(„search-ath“).value||““).toLowerCase();
  const filtered=athletes.filter(a=>a.name.toLowerCase().includes(q));
  document.getElementById(„ath-list-meta“).textContent=filtered.length+“ atletas“;
  const list=document.getElementById(„ath-list“);
  list.innerHTML=„“;
  filtered.forEach(a=>{
    const count=getDatesWithData().filter(d=>Object.values(sessions[d]?.[a.id]||{}).some(Boolean)).length;
    const row=document.createElement(„div“);
    row.className=„ath-list-row“;
    row.innerHTML=`<div class=„ath-list-av“>${getInitials(a.name)}</div><div style=„flex:1;font-size:13px“>${a.name}</div><div style=„font-size:10px;color:var(--muted);margin-right:8px“>${count} sessões</div><button class=„ath-del“ onclick=„removeAthlete(${a.id})“>×</button>`;
    list.appendChild(row);
  });
}

function addAthlete(){
  const name=document.getElementById(„new-name“).value.trim();
  if(!name||athletes.find(a=>a.name.toLowerCase()===name.toLowerCase())) return;
  athletes.push({id:Date.now(),name});
  save(„tl4_athletes“,athletes);
  document.getElementById(„new-name“).value=„“;
  renderAthletesList(); updateMeta();
}

function removeAthlete(id){
  if(!confirm(„Remover atleta?“)) return;
  athletes=athletes.filter(a=>a.id!==id);
  save(„tl4_athletes“,athletes);
  renderAthletesList(); renderToday();
}

function setView(v){
  document.querySelectorAll(„.view“).forEach(el=>el.classList.remove(„active“));
  document.querySelectorAll(„.nav-btn“).forEach(el=>el.classList.remove(„active“));
  document.getElementById(„view-„+v).classList.add(„active“);
  document.querySelectorAll(„.nav-btn“)[[„today“,“history“,“athletes“].indexOf(v)].classList.add(„active“);
  if(v===„history“) renderHistory();
  else if(v===„athletes“) renderAthletesList();
  else renderToday();
}

function onDateChange(){
  selectedDate=document.getElementById(„date-input“).value;
  renderToday();
}

updateMeta();
renderToday();
</script>
</body>
</html>
